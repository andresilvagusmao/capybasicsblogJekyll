---
layout: custom_post
---
<h1>Posts tagged: {{ page.tag }}</h1>

<ul class="post-list">
  {% for post in site.tags[page.tag] %}
  <li>
    <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
    <h3>
      <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h3>
    <p>{{ post.description }}</p>
  </li>
  {% endfor %}
</ul>
